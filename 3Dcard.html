<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image + Text Card</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #020617;
    }

    .card {
      width: 320px;
      height: 440px;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      cursor: pointer;
      perspective: 1000px;
      transform-style: preserve-3d;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card img {
      width: 100%;
      height: 60%;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 20px;
      text-align: center;
      color: #fff;
    }

    .card-content h2 {
      margin-bottom: 10px;
      font-size: 22px;
    }

    .card-content p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <img src="https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d?auto=format&fit=crop&w=600&q=80" alt="Card Image">
    <div class="card-content">
      <h2>Stunning Card</h2>
      <p>This card reacts to your mouse! Tilt it and see the shadow move.</p>
    </div>
  </div>

  <script>
    const card = document.getElementById("card");

    card.addEventListener("mousemove", (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const centerX = rect.width / 2;
      const centerY = rect.height / 2;

      const rotateX = ((y - centerY) / centerY) * 10;
      const rotateY = ((x - centerX) / centerX) * 10;

      card.style.transform = `rotateX(${-rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
      card.style.boxShadow = `${-rotateY*2}px ${rotateX*2}px 40px rgba(56,189,248,0.4)`;
    });

    card.addEventListener("mouseleave", () => {
      card.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
      card.style.boxShadow = `0 20px 40px rgba(0,0,0,0.5)`;
    });
  </script>

</body>
</html>
